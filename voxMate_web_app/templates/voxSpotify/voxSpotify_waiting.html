{% extends "layouts/boilerplate.html" %}

{% block head_content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/voxSpotify.css') }}" />
{% endblock %}

{% block main_content %}

<div class="container d-flex justify-content-center align-items-center">
    <div class="row">
        <div class="col">
            <div class="card card-shadow-left-bottom text-center">
                <div class="card-body">
                    <h4 class="card-title">
                        <span class="spotify-text">Wating for</span> 
                    <img src="{{ url_for('static', filename='images/spotify-name_logo.png') }}" 
                        alt="Spotify" 
                        class="spotify-title-logo">
                    </h4>

                    <hr>

                    <p class="card-text">
                        <p class="status_text">
                            Waiting for Spotify to login <br>
                            This page will <span class="text-danger">automatically refresh</span> when <span class="text-danger">Spotify has logged you in</span> <br>
                        </p>

                    </p>

                </div>
            </div>
        </div>
    </div>
</div>


{% endblock %}

{% block script_content %}
<script src="{{ url_for('static', filename='java/voxSpotify_waiting.js') }}"></script>
{% endblock %}
