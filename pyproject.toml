[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.voxenv
  | logs
  | build
  | dist
  | test_runs
  | reports
  | gaffer
  | __pycache__
  | run_voxMate_web_app.sh
  | stop_voxMate.sh
  | run_voxMate.sh
)/
'''