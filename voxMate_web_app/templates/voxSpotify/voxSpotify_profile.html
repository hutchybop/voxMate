{% extends "layouts/boilerplate.html" %}

{% block head_content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/voxSpotify.css') }}" />
{% endblock %}

{% block main_content %}

<div class="container d-flex justify-content-center align-items-center">
    <div class="row">
        <div class="col">
            <div class="card card-shadow-left-bottom text-center">
                <div class="card-body">
                    <h4 class="card-title">
                        <img src="{{ url_for('static', filename='images/spotify-name_logo.png') }}" 
                            alt="Spotify" 
                            class="spotify-title-logo">
                    </h4>

                    <hr>

                    <p class="card-text">
                        <p>
                            Welcome <span class="spotify-text">{{current_user['display_name']}}!</span>  <br>
                            You are logged in with Spotify. <br>
                            voxMate now has access your Spotify account. <br>
                            To logout use the button below. <br>
                        </p>

                    </p>

                    <hr>

                    <a href="{{ url_for('voxSpotify.voxSpotify_logout') }}" class="btn btn-dark d-inline-flex align-items-center gap-2">
                        <img src="{{ url_for('static', filename='images/spotify_logo.png') }}" 
                            alt="Spotify" 
                            class="spotify-button-logo">
                        <span class="spotify-text">Logout of Spotify</span> 
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>


{% endblock %}
